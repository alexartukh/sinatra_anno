- name: 'use_state_var'
  regexp: 'const \[\s*(\w+)\s*,\s*set\w+\s*\]\s*=\s*useState\b'
  css: 'background-color: magenta;'
  priority: 300
  group: 1

- name: 'use_state_setter'
  regexp: 'const \[\s*\w+\s*,\s*(set\w+)\s*\]\s*=\s*useState\b'
  css: 'background-color: yellow;'
  priority: 400
  group: 1
  
- name: 'id1'
  regexp: '\b\w+\b'
  css: 'background-color: cyan;'
  priority: 5
  belong_to_list: 'use_state_var'

- name: 'id2'
  regexp: '\b\w+\b'
  css: 'background-color: cyan;'
  priority: 6
  belong_to_list: 'use_state_setter'
  